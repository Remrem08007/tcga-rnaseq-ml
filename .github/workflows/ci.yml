name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -W error::FutureWarning
      - name: Compile package
        run: python -m compileall -q src
      - name: Source CLI smoke test
        run: python -m tcga_ml.download --list >/dev/null
      - name: Cohort CLI smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m tcga_ml.cohort_cli \
            --expression tests/fixtures/expression_small.tsv \
            --quality tests/fixtures/quality_small.tsv \
            --outdir "$tmpdir" >/dev/null
          test -s "$tmpdir/cohort.tsv"
          test -s "$tmpdir/cohort_summary.json"
      - name: Cache and audit CLI smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m tcga_ml.cache_cli \
            --expression tests/fixtures/expression_cache_small.tsv \
            --cohort tests/fixtures/cohort_cache_small.tsv \
            --outdir "$tmpdir" \
            --chunk-genes 2 >/dev/null
          python -m tcga_ml.audit_cli \
            --matrix "$tmpdir/expression.float32.npy" \
            --output "$tmpdir/audit.json" >/dev/null
          python - <<PY
          import json
          import numpy as np
          m = np.load("$tmpdir/expression.float32.npy", mmap_mode="r")
          assert m.shape == (2, 3)
          assert m.dtype == np.float32
          audit = json.load(open("$tmpdir/audit.json"))
          assert audit["shape"] == [2, 3]
          PY
      - name: Split CLI smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m tcga_ml.split_cli \
            --samples tests/fixtures/samples_split_small.tsv \
            --outdir "$tmpdir" \
            --holdout-fraction 0.2 \
            --seed 20260825 >/dev/null
          python - <<PY
          import json
          summary = json.load(open("$tmpdir/split_summary.json"))
          assert summary["n_development"] == 12
          assert summary["n_holdout"] == 3
          assert len(summary["manifest_sha256"]) == 64
          PY
      - name: Benchmark CLI smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python - <<PY
          import csv
          import numpy as np
          from pathlib import Path
          p = Path("$tmpdir")
          rng = np.random.default_rng(3)
          blocks = []
          labels = []
          for ci, label in enumerate(["BRCA", "LUAD", "LUSC"]):
              block = rng.lognormal(0.5, 0.2, size=(15, 9)).astype("float32")
              block[:, ci*3:ci*3+3] *= 6
              blocks.append(block)
              labels += [label] * 15
          np.save(p / "x.npy", np.vstack(blocks))
          with (p / "split.tsv").open("w", newline="") as handle:
              writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
              writer.writerow(["cache_index", "participant_barcode", "cancer_type", "split"])
              for i, label in enumerate(labels):
                  writer.writerow([i, f"TCGA-AA-{i:04d}", label, "holdout" if i % 5 == 0 else "development"])
          PY
          python -m tcga_ml.benchmark_cli \
            --matrix "$tmpdir/x.npy" \
            --split "$tmpdir/split.tsv" \
            --outdir "$tmpdir/out" \
            --model dummy \
            --model logistic_l2 \
            --cv-folds 3 \
            --n-jobs 1 >/dev/null
          test -s "$tmpdir/out/benchmark.json"
