name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest
      - name: Compile package
        run: python -m compileall -q src
      - name: Source CLI smoke test
        run: python -m tcga_ml.download --list >/dev/null
      - name: Cohort CLI smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python -m tcga_ml.cohort_cli \
            --expression tests/fixtures/expression_small.tsv \
            --quality tests/fixtures/quality_small.tsv \
            --outdir "$tmpdir" >/dev/null
          test -s "$tmpdir/cohort.tsv"
          test -s "$tmpdir/cohort_summary.json"
